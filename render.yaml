services:
  - type: web
    name: rag-pdf-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL_NAME
        value: qwen/qwen2.5-7b-instruct
      - key: EMBEDDING_MODEL_TYPE
        value: huggingface_qwen
      - key: LLM_API_KEY
        sync: false
